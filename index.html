<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF5F8">
<title>喵喵棒棒糖梦工厂</title>
<style>
:root{--pri:#E75480}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100dvh;overflow:hidden;font-family:system-ui,sans-serif;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#1a0a2e;display:flex;justify-content:center;align-items:center}
#game{width:100%;max-width:960px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.header{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:rgba(255,255,255,.92);z-index:10}
.header .brand{font-size:clamp(18px,3vw,28px);font-weight:800;color:var(--pri)}
.header .coins{font-size:clamp(20px,3vw,28px);font-weight:800;color:#FF9500}
#stage-wrap{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
#pixi-canvas{position:absolute;inset:0;z-index:1}
.cat-el{position:absolute;font-size:clamp(60px,13vw,120px);z-index:3;pointer-events:none;transition:transform .3s}
.customer-el{position:absolute;font-size:clamp(54px,12vw,110px);z-index:3;pointer-events:none;transition:transform .4s}
.bubble-el{position:absolute;z-index:4;pointer-events:none;background:#FFF;border:3px solid var(--pri);border-radius:clamp(14px,2.5vw,22px);padding:clamp(4px,1vw,8px) clamp(10px,2vw,16px);font-size:clamp(18px,3vw,28px);box-shadow:0 4px 0 rgba(0,0,0,.08);white-space:nowrap;animation:float 1.2s ease-in-out infinite}
.bubble-el::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:#FFF;border-bottom:none}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.diff-badge{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);border-radius:10px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--pri);z-index:5;pointer-events:none}
.press-hint{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);font-size:clamp(14px,2.2vw,20px);color:var(--pri);font-weight:700;z-index:5;pointer-events:none;background:rgba(255,255,255,.85);padding:6px 16px;border-radius:16px;transition:opacity .3s}
.controls{flex-shrink:0;padding:clamp(8px,1.2vw,14px);background:rgba(255,255,255,.95);z-index:10;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1vw,10px)}
.step-bar{display:flex;gap:clamp(6px,1.2vw,10px)}
.step-dot{padding:clamp(6px,1vw,10px) clamp(12px,2vw,18px);border-radius:20px;background:#FFE0E9;color:var(--pri);font-size:clamp(13px,2vw,16px);font-weight:700;cursor:pointer;transition:all .2s;border:none;font-family:inherit}
.step-dot.active{background:var(--pri);color:#FFF;transform:scale(1.05)}
.step-title{font-size:clamp(16px,2.5vw,24px);font-weight:700;color:var(--pri)}
.btn-row{display:flex;justify-content:center;gap:clamp(10px,2vw,16px);flex-wrap:wrap}
.btn-sel{width:clamp(84px,22vw,160px);height:clamp(84px,22vw,160px);border-radius:clamp(18px,3vw,26px);border:4px solid #E8E8E8;background:#FFF;font-size:clamp(34px,8vw,58px);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 #DDD}
.btn-sel:active{transform:translateY(4px);box-shadow:0 1px 0 #DDD}
.btn-sel.selected{border-color:var(--pri);background:#FFF0F5;transform:scale(1.1)}
.btn-finish{background:linear-gradient(135deg,var(--pri),#FF8E53);color:#FFF;border:none;border-radius:20px;padding:clamp(14px,2vw,18px) clamp(28px,5vw,40px);font-size:clamp(18px,2.5vw,24px);font-weight:800;cursor:pointer;box-shadow:0 5px 0 #C44569;font-family:inherit;width:100%;max-width:300px}
.btn-finish:active{transform:translateY(3px);box-shadow:0 2px 0 #C44569}
</style>
</head>
<body>
<div id="game">
  <div class="header">
    <div class="brand">🐱 喵喵棒棒糖梦工厂</div>
    <div class="coins">🪙 <span id="coin-count">0</span></div>
  </div>
  <div id="stage-wrap">
    <div id="pixi-canvas"></div>
    <div class="cat-el" id="cat-el">🐱</div>
    <div class="customer-el" id="customer-el">🐰</div>
    <div class="bubble-el" id="bubble-el">🍓 + ⭐</div>
    <div class="press-hint" id="press-hint">👆 选一个水果放进锅里吧~</div>
    <div class="diff-badge" id="diff-badge">⭐ 入门</div>
  </div>
  <div class="controls" id="controls">
    <div class="step-bar">
      <button class="step-dot active" id="dot1">① 选水果</button>
      <button class="step-dot" id="dot2">② 选模具</button>
      <button class="step-dot" id="dot3">③ 撒装饰</button>
    </div>
    <div class="step-title" id="step-title">① 选一个水果</div>
    <div class="btn-row" id="step-row"></div>
    <button class="btn-finish" id="btn-finish">✨ 完成！</button>
  </div>
</div>

<script type="module">
import * as PIXI from 'pixi.js';

const FRUITS=[{e:'🍓',c:0xF15B5B},{e:'🍌',c:0xFFD700},{e:'🍇',c:0xAB47BC},{e:'🍏',c:0x66BB6A},{e:'🫐',c:0x42A5F5},{e:'🍊',c:0xFFA726}];
const MOLDS=[{e:'⭐'},{e:'💖'},{e:'🧸'},{e:'🐾'},{e:'🚀'},{e:'🟣'}];
const DECORS=[{e:'🌈'},{e:'🌟'},{e:'🍫'},{e:'🌸'},{e:'💕'},{e:'🍬'}];
const CUST=['🐰','🐻','🦊','🐸','🐶','🐱','🐼','🐨','🐯','🐮','🐷','🐵'];
const STAGES=[{n:3,t:0,s:'⭐',nm:'入门'},{n:4,t:25,s:'⭐⭐',nm:'进阶'},{n:6,t:60,s:'⭐⭐⭐',nm:'熟练'}];

let coins=+(localStorage.getItem('mm_coins')||0);
let step=1,si=0,pF=-1,pM=-1,pD=[],tF=0,tM=0,lc=-1,lk=false;

// Audio
let ax=null;function ac(){if(!ax)ax=new(window.AudioContext||window.webkitAudioContext)();return ax}
function to(f,d,t='sine',v=.1){try{let c=ac(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}

// DOM
const el=id=>document.getElementById(id);
const cc=el('coin-count'),db=el('diff-badge'),st=el('step-title'),sr=el('step-row'),bf=el('btn-finish');
const be=el('bubble-el'),ce=el('customer-el'),cat=el('cat-el'),ph=el('press-hint');
const sd=[el('dot1'),el('dot2'),el('dot3')];
bf.style.display='none';

// PixiJS
const pe=el('pixi-canvas');
let app,W=400,H=600;
let bgL,fxL,llL,pot,lp;

try{
  app=new PIXI.Application({resizeTo:pe,backgroundAlpha:0,antialias:true,resolution:Math.min(devicePixelRatio||1,2),autoDensity:true});
  pe.appendChild(app.view);
  bgL=new PIXI.Container();fxL=new PIXI.Container();llL=new PIXI.Container();
  app.stage.addChild(bgL,fxL,llL);
}catch(e){console.error('PixiJS init failed:',e)}

function bg(){
  if(!app)return;
  bgL.removeChildren();W=app.screen.width;H=app.screen.height;
  const g=new PIXI.Graphics();
  g.beginFill(0xB3E5FC);g.drawRect(0,0,W,H*.3);g.endFill();
  g.beginFill(0x81D4FA);g.drawRect(0,H*.27,W,H*.04);g.endFill();
  g.beginFill(0xE8D5B7);g.drawRect(0,H*.31,W,H*.04);g.endFill();
  g.beginFill(0xDEB887);g.drawRect(0,H*.36,W,H*.03);g.endFill();
  g.beginFill(0xFFE4C9);g.drawRect(0,H*.39,W,H*.61);g.endFill();
  g.beginFill(0xDEB887);g.drawRoundedRect(W*.06,H*.57,W*.88,12,6);g.endFill();
  bgL.addChild(g);

  if(pot)fxL.removeChild(pot);
  pot=new PIXI.Container();pot.x=W*.5;pot.y=H*.54;fxL.addChild(pot);
  dpot();
  if(lp)llL.removeChild(lp);
  lp=new PIXI.Container();lp.x=W*.5;lp.y=H*.32;lp.scale.set(0);llL.addChild(lp);

  cat.style.left=(W*.06)+'px';cat.style.top=(H*.66)+'px';
  ce.style.left=(W*.68)+'px';ce.style.top=(H*.66)+'px';
  be.style.left=(W*.54)+'px';be.style.top=(H*.34)+'px';
}

function dpot(){
  pot.removeChildren();const s=W/360;
  const sh=new PIXI.Graphics();sh.beginFill(0,0.15);sh.drawEllipse(0,42*s,30*s,6*s);sh.endFill();pot.addChild(sh);
  const bd=new PIXI.Graphics();bd.beginFill(0x7B5EA7);bd.drawRoundedRect(-30*s,0,60*s,40*s,8*s);bd.endFill();bd.lineStyle(3*s,0x5B3A7A);bd.drawRoundedRect(-30*s,0,60*s,40*s,8*s);pot.addChild(bd);
  const rm=new PIXI.Graphics();rm.beginFill(0x9B6FC0);rm.drawEllipse(0,0,30*s,8*s);rm.endFill();rm.lineStyle(2*s,0x5B3A7A);rm.drawEllipse(0,0,30*s,8*s);pot.addChild(rm);
  const lq=new PIXI.Graphics();lq.name='lq';lq.beginFill(0xFFD166);lq.drawEllipse(0,-2*s,25*s,6*s);lq.endFill();lq.beginFill(0xFFD166);lq.drawRoundedRect(-25*s,-8*s,50*s,8*s,4*s);lq.endFill();pot.addChild(lq);
  const le=new PIXI.Graphics();le.beginFill(0xFFFFFF);le.drawCircle(-10*s,18*s,6*s);le.endFill();le.beginFill(0x333333);le.drawCircle(-9*s,19*s,3*s);le.endFill();pot.addChild(le);
  const re=new PIXI.Graphics();re.beginFill(0xFFFFFF);re.drawCircle(10*s,18*s,6*s);re.endFill();re.beginFill(0x333333);re.drawCircle(11*s,19*s,3*s);re.endFill();pot.addChild(re);
  const hl=new PIXI.Graphics();hl.lineStyle(3*s,0x7B5EA7);hl.drawCircle(-30*s,20*s,6*s);pot.addChild(hl);
  const hr=new PIXI.Graphics();hr.lineStyle(3*s,0x7B5EA7);hr.drawCircle(30*s,20*s,6*s);pot.addChild(hr);
}

function ulq(c){
  if(!pot)return;const lq=pot.getChildByName('lq');if(!lq)return;lq.clear();const s=W/360;
  lq.beginFill(c);lq.drawEllipse(0,-2*s,25*s,6*s);lq.endFill();lq.beginFill(c);lq.drawRoundedRect(-25*s,-8*s,50*s,8*s,4*s);lq.endFill();
}

// Particles
const ps=[];
function bt(n,c,x,y){
  if(!fxL)return;for(let i=0;i<n;i++){const g=new PIXI.Graphics();const r=3+Math.random()*6;
  if(i%2){g.beginFill(c,.7);g.drawStar(0,0,5,r,r*.5);g.endFill()}else{g.beginFill(c);g.drawCircle(0,0,r);g.endFill()}
  g.x=x;g.y=y;fxL.addChild(g);ps.push({g,vx:(Math.random()-.5)*8,vy:-(2+Math.random()*6),lf:1})}
}
function up(dt){for(let i=ps.length-1;i>=0;i--){const p=ps[i];p.g.x+=p.vx*dt;p.g.y+=p.vy*dt;p.vy+=.2*dt;p.lf-=.025*dt;p.g.alpha=Math.max(0,p.lf);p.g.scale.set(p.lf);if(p.lf<=0){fxL.removeChild(p.g);p.g.destroy();ps.splice(i,1)}}}

// Tweens
const tws=[];
function tw(obj,props,dur,ez,dn){const st={};for(const k in props)st[k]=obj[k]??0;tws.push({obj,props,st,dur,el:0,ez:ez||(t=>t),dn})}
function eoc(t){return 1-Math.pow(1-t,3)}
function eob(t){const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}
function sp(obj,d=.4){tw(obj.scale,{x:1.3,y:1.3},d*.4,eob,()=>tw(obj.scale,{x:1,y:1},d*.6,eoc))}

// Game loop
if(app){app.ticker.add(d=>{const dt=d/60;
  for(let i=tws.length-1;i>=0;i--){const t=tws[i];t.el+=dt;const p=Math.min(t.el/t.dur,1),v=t.ez(p);
  for(const k in t.props)t.obj[k]=t.st[k]+(t.props[k]-t.st[k])*v;if(p>=1){t.dn?.();tws.splice(i,1)}}
  up(dt);
})}

// UI
function ud(){sd.forEach((d,i)=>d.classList.toggle('active',i+1===step))}
function rb(){
  sr.innerHTML='';bf.style.display='none';
  if(step===1){st.textContent='① 选一个水果';
    for(let i=0;i<STAGES[si].n;i++){const b=document.createElement('div');b.className='btn-sel'+(i===pF?' selected':'');b.textContent=FRUITS[i].e;b.onclick=()=>pf(i);sr.appendChild(b)}
  }else if(step===2){st.textContent='② 选一个模具';
    for(let i=0;i<MOLDS.length;i++){const b=document.createElement('div');b.className='btn-sel'+(i===pM?' selected':'');b.textContent=MOLDS[i].e;b.onclick=()=>pm(i);sr.appendChild(b)}
  }else if(step===3){st.textContent='③ 撒装饰粒（可多选）';bf.style.display='block';
    for(let i=0;i<DECORS.length;i++){const b=document.createElement('div');b.className='btn-sel'+(pD.includes(i)?' selected':'');b.textContent=DECORS[i].e;b.onclick=()=>td(i);sr.appendChild(b)}
    ulp();
  }
}
function gs(s){if(lk)return;if(s===2&&pF<0){gs(1);return}if(s===3&&pM<0){gs(2);return}step=s;ud();rb()}
window.gs=gs;
sd[0].onclick=()=>gs(1);sd[1].onclick=()=>gs(2);sd[2].onclick=()=>gs(3);

// Pick
function pf(i){if(lk)return;to(800,.06);pF=i;rb();
  if(pot){ulq(FRUITS[i].c);tw(pot,{y:pot.y-4},.15,eoc,()=>tw(pot,{y:pot.y+4},.15));bt(8,FRUITS[i].c,pot.x,pot.y-10)}
  to(400,.12,'triangle');setTimeout(()=>to(300,.15,'triangle'),100);
  setTimeout(()=>gs(2),600)}
function pm(i){if(lk)return;to(800,.06);pM=i;rb();ulp();setTimeout(()=>gs(3),400)}
function td(i){to(800,.06);const x=pD.indexOf(i);if(x>=0)pD.splice(x,1);else pD.push(i);rb();ulp()}
function ulp(){if(!lp)return;lp.removeChildren();lp.scale.set(0);if(pF<0||pM<0)return;const s=W/400;
  const stk=new PIXI.Graphics();stk.beginFill(0xFFFFFF);stk.lineStyle(1,0xDDD);stk.drawRoundedRect(-4*s,0,8*s,40*s,3*s);stk.endFill();lp.addChild(stk);
  const hd=new PIXI.Graphics();hd.beginFill(FRUITS[pF].c);hd.drawCircle(0,-12*s,24*s);hd.endFill();hd.beginFill(0xFFFFFF,.2);hd.drawCircle(-7*s,-17*s,5*s);hd.endFill();lp.addChild(hd);
  sp(lp,.5)}

// Finish
function fin(){
  if(lk||pF<0||pM<0)return;lk=true;to(600,.08);setTimeout(()=>to(900,.1),80);setTimeout(()=>to(1200,.12),150);
  if(pot){tw(pot,{y:pot.y-3},.2,eoc,()=>tw(pot,{y:pot.y+3},.2));bt(24,FRUITS[pF].c,pot.x,pot.y);bt(12,0xFFD700,pot.x,pot.y)}
  sp(lp,.6);const ok=pF===tF&&pM===tM;
  setTimeout(()=>{
    coins+=ok?10:5;cc.textContent=coins;localStorage.setItem('mm_coins',coins);
    ub();cat.style.transform='scale(1.3)';setTimeout(()=>cat.style.transform='',400);
    [523,659,784].forEach((f,i)=>setTimeout(()=>to(f,.12),i*100));
    bt(16,0xFFD700,W*.12,H*.60);be.textContent=ok?'✨ 一模一样！':'😋 创新口味！';ph.style.opacity='0';
    setTimeout(()=>nx(),2200);
  },1200)}
window.fin=fin;
bf.onclick=fin;

// Flow
function nx(){lk=false;pF=-1;pM=-1;pD=[];if(lp)lp.scale.set(0);
  const s=STAGES[si];tF=Math.floor(Math.random()*s.n);tM=Math.floor(Math.random()*MOLDS.length);
  let ci;do{ci=Math.floor(Math.random()*CUST.length)}while(ci===lc&&CUST.length>1);lc=ci;
  ce.textContent=CUST[ci];be.textContent=FRUITS[tF].e+' + '+MOLDS[tM].e;ph.style.opacity='1';gs(1)}
function ub(){for(let i=STAGES.length-1;i>=0;i--){if(coins>=STAGES[i].t){si=i;break}}db.textContent=STAGES[si].s+' '+STAGES[si].nm}

// Init
cc.textContent=coins;ub();bg();nx();
window.addEventListener('resize',()=>bg());
</script>
</body>
</html>
